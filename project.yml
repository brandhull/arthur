name: Arthur
options:
  bundleIdPrefix: com.brandonhull
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

# One version for all three targets — they ship together and share ArthurKit.
# MARKETING_VERSION is hand-edited per VERSIONING.md; CURRENT_PROJECT_VERSION
# is only a fallback — each target's post-build script overwrites the built
# CFBundleVersion with the git commit count.
settings:
  base:
    MARKETING_VERSION: "1.6.5"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ArthurKit:
    path: ArthurKit

targets:
  Arthur-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Sources/App
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: ArthurKit
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Explicit, not just relying on the default — lets iPad users run
        # Arthur in Split View / Slide Over / windowed Stage Manager tiles
        # alongside other apps, not just full screen.
        UIRequiresFullScreen: false
    postBuildScripts:
      - name: Stamp build number
        basedOnDependencyAnalysis: false
        script: |
          BUILD=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
    settings:
      PRODUCT_NAME: Arthur
      PRODUCT_BUNDLE_IDENTIFIER: com.brandonhull.arthur
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: D53LTKT473
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/Arthur-iOS.entitlements
      properties:
        # Explicit shared identifier, not the $(CFBundleIdentifier)-derived
        # default — Arthur-iOS/Arthur-Mac/ArthurBar are three different
        # bundle IDs, so the default per-target KVS identifier would give
        # each one its own isolated iCloud store instead of one shared
        # settings sync. All three targets use this exact same string.
        com.apple.developer.ubiquity-kvstore-identifier: D53LTKT473.com.brandonhull.arthur.shared

  Arthur-Mac:
    type: application
    platform: macOS
    sources:
      - path: App/Sources/App
      - path: App/Resources
        buildPhase: resources
      - path: App/Resources-Mac
        buildPhase: resources
    dependencies:
      - package: ArthurKit
    info:
      path: App/Info-Mac.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
    postBuildScripts:
      - name: Stamp build number
        basedOnDependencyAnalysis: false
        script: |
          BUILD=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
    settings:
      PRODUCT_NAME: Arthur
      PRODUCT_BUNDLE_IDENTIFIER: com.brandonhull.arthur.mac
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: D53LTKT473
      ENABLE_HARDENED_RUNTIME: true
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/Arthur-Mac.entitlements
      properties:
        # Same shared identifier as every other target — see Arthur-iOS's
        # entitlements comment for why this can't just be the default.
        com.apple.developer.ubiquity-kvstore-identifier: D53LTKT473.com.brandonhull.arthur.shared

  ArthurBar:
    type: application
    platform: macOS
    sources:
      - path: Bar/Sources/Bar
      - path: App/Resources-Mac
        buildPhase: resources
    dependencies:
      - package: ArthurKit
    info:
      path: Bar/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
    postBuildScripts:
      - name: Stamp build number
        basedOnDependencyAnalysis: false
        script: |
          BUILD=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.brandonhull.arthurbar
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: D53LTKT473
      ENABLE_HARDENED_RUNTIME: true
    entitlements:
      path: Bar/ArthurBar.entitlements
      properties:
        # Same shared identifier as every other target — see Arthur-iOS's
        # entitlements comment for why this can't just be the default.
        com.apple.developer.ubiquity-kvstore-identifier: D53LTKT473.com.brandonhull.arthur.shared
      # Same icon as the main app — ArthurBar shows up in Brandon's actual
      # Applications list now (a real login item, not just an Xcode debug
      # artifact), so it should look like it belongs there instead of
      # using Xcode's generic default icon.
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Arthur-iOS:
    build:
      targets:
        Arthur-iOS: all
    run:
      config: Debug
  Arthur-Mac:
    build:
      targets:
        Arthur-Mac: all
    run:
      config: Debug
  ArthurBar:
    build:
      targets:
        ArthurBar: all
    run:
      config: Debug
